name: ci
# Advisory checks (no branch protection on the free plan; Veri review is the gate, DECISION-LEDGER #24).
# Actions minutes are exhausted (DECISION-LEDGER #70): a pull request runs the static checks only
# (TZ=UTC, no `pnpm test`) because Veri runs the full suite locally in both time zones at the PR head;
# a push to main runs the full suite on the UTC + America/New_York matrix. Superseded PR runs are
# cancelled, and docs-only changes skip this workflow entirely.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs run UTC only; main runs UTC + America/New_York (both time zones stay required on main).
        tz: ${{ github.event_name == 'pull_request' && fromJSON('["UTC"]') || fromJSON('["UTC", "America/New_York"]') }}
    env:
      TZ: ${{ matrix.tz }}
      APP_DATA_CLASS: SYNTHETIC
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Full suite on pushes to main only; on a PR, Veri runs it locally in both time zones.
      - if: github.event_name == 'push'
        run: pnpm test
      - run: pnpm seed:lint
      - name: drizzle check + schema/migration drift
        run: pnpm db:check
      - run: pnpm build
      - name: build refuses non-synthetic data class
        run: |
          if APP_DATA_CLASS=REAL pnpm build > /tmp/neg.log 2>&1; then echo "build should have failed"; exit 1; fi
          grep -q "APP_DATA_CLASS must be SYNTHETIC" /tmp/neg.log
